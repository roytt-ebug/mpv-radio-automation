name: Build Windows app
on:
  push:
    branches: [main]
    paths: ['app/**', 'installer/**', 'payload/**', 'tests/**', 'docs/WINDOWS-APP.md', '.github/workflows/windows-app.yml']
  pull_request:
    paths: ['app/**', 'installer/**', 'payload/**', 'tests/**', 'docs/WINDOWS-APP.md', '.github/workflows/windows-app.yml']
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Build native app, portable ZIP and per-user setup EXE
        id: build
        shell: powershell
        run: .\installer\Build-App.ps1
      - name: Exercise and render the native interface without touching user settings
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path artifacts -Force | Out-Null
          $app = Resolve-Path .\dist\AutomaticMusic\AutomaticMusic.exe
          $check = Start-Process -FilePath $app -ArgumentList '--self-test' -Wait -PassThru -RedirectStandardError artifacts/ui-self-test-errors.txt
          if ($check.ExitCode -ne 0) { Get-Content artifacts/ui-self-test-errors.txt; throw 'UI self-test failed.' }
          foreach ($page in @('music','setup','advanced')) {
            $mode = if ($page -eq 'music') { '--screenshot' } else { '--screenshot-' + $page }
            $png = Join-Path $pwd ('artifacts\Automatic-Music-' + $page + '.png')
            $errorFile = Join-Path $pwd ('artifacts\ui-error-' + $page + '.txt')
            $capture = Start-Process -FilePath $app -ArgumentList @($mode, ('"' + $png + '"')) -Wait -PassThru -RedirectStandardError $errorFile
            if ($capture.ExitCode -ne 0 -or -not (Test-Path -LiteralPath $png)) { Get-Content -LiteralPath $errorFile; throw "UI capture failed: $page" }
          }
      - name: Test settings, process arguments, ownership and task registration
        id: backend
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: powershell
        run: |
          $compiler = Join-Path $env:WINDIR 'Microsoft.NET\Framework64\v4.0.30319\csc.exe'
          New-Item -ItemType Directory -Path artifacts -Force | Out-Null
          $appFolder = Join-Path $pwd 'dist\AutomaticMusic'
          $testSource = Join-Path $pwd 'tests\AppBackendTests.cs'
          $arguments = @('/nologo','/target:exe','/platform:x64','/codepage:65001',
            ('/out:' + (Join-Path $appFolder 'AppBackendTests.exe')),
            ('/reference:' + (Join-Path $appFolder 'AutomaticMusic.exe')),
            '/reference:System.Web.Extensions.dll','/reference:System.Core.dll',
            '/reference:System.Xml.dll','/reference:Microsoft.CSharp.dll',$testSource)
          & $compiler @arguments
          if ($LASTEXITCODE -ne 0) { throw 'Backend test compilation failed.' }
          & .\dist\AutomaticMusic\AppBackendTests.exe .\dist\AutomaticMusic
          if ($LASTEXITCODE -ne 0) { throw 'Backend tests failed.' }
      - name: Test offline component failures and actual verified upstream installation
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: powershell
        run: .\tests\Test-AppComponents.ps1 -Integration -AppDirectory .\dist\AutomaticMusic
      - name: Install, upgrade and uninstall as a real standard Windows user
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.backend.outcome == 'success' }}
        shell: powershell
        run: .\tests\Test-AppPackage.ps1 -SetupPath .\dist\Automatic-Music-Setup-0.2.0-beta.1.exe
      - name: Publish tested beta installer and portable download
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: Automatic-Music-0.2.0-beta.1-Windows-x64
          path: |
            dist/Automatic-Music-Setup-0.2.0-beta.1.exe
            dist/Automatic-Music-0.2.0-beta.1-portable.zip
            dist/SHA256SUMS.txt
            docs/WINDOWS-APP.md
          if-no-files-found: error
          retention-days: 30
      - name: Save actual Windows interface screenshots
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: Automatic-Music-Windows-interface
          path: artifacts/*.png
          if-no-files-found: ignore
          retention-days: 30
