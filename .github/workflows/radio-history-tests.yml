name: Radio history tests
on:
  push:
    paths:
      - 'payload/portable_config/scripts/random-start.lua'
      - 'tests/test-radio-history.lua'
      - '.github/workflows/radio-history-tests.yml'
  pull_request:
    paths:
      - 'payload/portable_config/scripts/random-start.lua'
      - 'tests/test-radio-history.lua'
      - '.github/workflows/radio-history-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lua-history:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install test interpreters
        run: sudo apt-get update -qq && sudo apt-get install -y lua5.4 luajit
      - name: Test history with Lua 5.4
        run: lua5.4 tests/test-radio-history.lua
      - name: Test history with LuaJIT
        run: luajit tests/test-radio-history.lua
